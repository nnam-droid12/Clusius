[project]
name = "clusius-workspace"
version = "0.1.0"
description = "Clusius: autonomous x86-to-Arm64 AI inference migration and optimization agent"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core", "packages/api", "packages/agent"]

[dependency-groups]
# ruff/mypy are configured below but were never actually declared as installable
# dependencies anywhere in the workspace (only each package's own pytest dev-group
# was) - `uv sync --all-packages` silently never installed them, which is exactly
# why CI's Lint step has been failing with "Failed to spawn: ruff" since this
# workflow was first added. They only "worked" locally because of an ambient
# install on this dev machine outside the project's own dependency graph.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's documented
# dependency-injection idiom, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# Neither ships type stubs and neither has a real types-* package on PyPI (unlike
# jsonschema, which does - see the dev dependency group above).
[[tool.mypy.overrides]]
module = ["fabric.*", "llmcompressor.*"]
ignore_missing_imports = true
