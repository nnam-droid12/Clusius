[project]
name = "clusius-workspace"
version = "0.1.0"
description = "Clusius: autonomous x86-to-Arm64 AI inference migration and optimization agent"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core", "packages/api", "packages/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
