[project]
name = "clusius-core"
version = "0.1.0"
description = "Clusius engine: workload analysis, Arm64 migration, auto-tuning, benchmarking, and reporting"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "optuna>=3.6",
    "fabric>=3.2",
    "paramiko>=3.4",
    "google-cloud-compute>=1.19",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.20",
]

[project.scripts]
clusius-bench = "clusius_core.bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusius_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
