[project]
name = "clusius-agent"
version = "0.1.0"
description = "Showcase multi-model RAG/MCP research agent — the workload Clusius migrates and optimizes"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "duckduckgo-search>=6.2",
]

[project.scripts]
clusius-agent-serve = "clusius_agent.serve:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusius_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
