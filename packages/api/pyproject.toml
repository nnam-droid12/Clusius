[project]
name = "clusius-api"
version = "0.1.0"
description = "Clusius orchestration API: run management, SSE streaming, persistence"
requires-python = ">=3.11"
dependencies = [
    "clusius-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "pydantic-settings>=2.3",
]

[tool.uv.sources]
clusius-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusius_api"]
