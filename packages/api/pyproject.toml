[project]
name = "clusius-api"
version = "0.1.0"
description = "Clusius orchestration API: run management, SSE streaming, persistence"
requires-python = ">=3.11"
dependencies = [
    "clusius-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[tool.uv.sources]
clusius-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusius_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
